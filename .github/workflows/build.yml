void put_pixel(struct limine_framebuffer *fb, int x, int y, uint32_t color) {
    if (x < 0 || y < 0 || x >= (int)fb->width || y >= (int)fb->height) return;
    uint32_t *buf = fb->address;
    buf[y * (fb->pitch/4) + x] = color;
}

void draw_rect(struct limine_framebuffer *fb, int x, int y, int w, int h, uint32_t color) {
    for (int j = 0; j < h; j++)
        for (int i = 0; i < w; i++)
            put_pixel(fb, x+i, y+j, color);
}

void draw_char(struct limine_framebuffer *fb, int x, int y, char c, uint32_t color) {
    if (c < 0 || c > 127) return;
    for (int row = 0; row < 8; row++) {
        uint8_t bits = font[(int)c][row];
        for (int col = 0; col < 8; col++) {
            if (bits & (1 << (7-col))) put_pixel(fb, x+col, y+row, color);
        }
    }
}

void draw_text(struct limine_framebuffer *fb, int x, int y, const char *s, uint32_t color) {
    int cx = x;
    while (*s) {
        draw_char(fb, cx, y, *s, color);
        cx += 9;
        s++;
    }
}

static inline uint8_t inb(uint16_t port) {
    uint8_t ret;
    __asm__ volatile ("inb %1, %0" : "=a"(ret) : "Nd"(port));
    return ret;
}

void _start(void) {
    if (fb_req.response == NULL || fb_req.response->framebuffer_count < 1) {
        for(;;) __asm__("hlt");
    }
    struct limine_framebuffer *fb = fb_req.response->framebuffers[0];

    int mx = fb->width / 2;
    int my = fb->height / 2;

    for (;;) {
        // DESKTOP - Windows 10 Blue #0078D7
        draw_rect(fb, 0, 0, fb->width, fb->height, 0x0078D7);

        // WINDOW - White with shadow
        draw_rect(fb, fb->width/2 - 200 + 4, fb->height/2 - 150 + 4, 400, 300, 0x000000);
        draw_rect(fb, fb->width/2 - 200, fb->height/2 - 150, 400, 300, 0xFFFFFF);
        draw_rect(fb, fb->width/2 - 200, fb->height/2 - 150, 400, 30, 0x0078D7);
        draw_text(fb, fb->width/2 - 180, fb->height/2 - 142, "MBS OS v2 - Windows", 0xFFFFFF);
        draw_text(fb, fb->width/2 - 150, fb->height/2 - 50, "MBS OS v2 Legend!", 0x000000);
        draw_text(fb, fb->width/2 - 180, fb->height/2 - 20, "Use ARROW KEYS to move", 0x555555);
        draw_text(fb, fb->width/2 - 180, fb->height/2 + 10, "Made by Rituparna", 0x0078D7);

        // TASKBAR
        draw_rect(fb, 0, fb->height - 40, fb->width, 40, 0x202020);
        draw_rect(fb, 10, fb->height - 35, 60, 30, 0x0078D7);
        draw_text(fb, 15, fb->height - 28, "MBS", 0xFFFFFF);

        // MOUSE CURSOR - White arrow
        draw_rect(fb, mx, my, 2, 12, 0xFFFFFF);
        draw_rect(fb, mx, my, 8, 2, 0xFFFFFF);
        draw_rect(fb, mx+1, my+2, 2, 2, 0x000000);
        draw_rect(fb, mx+2, my+4, 2, 2, 0x000000);

        // Keyboard input - PS/2 polling for arrow keys
        if (inb(0x64) & 1) {
            uint8_t scancode = inb(0x60);
            if (scancode == 0x48) my -= 10; // Up
            if (scancode == 0x50) my += 10; // Down
            if (scancode == 0x4B) mx -= 10; // Left
            if (scancode == 0x4D) mx += 10; // Right
        }
        if (mx < 0) mx = 0;
        if (my < 0) my = 0;
        if (mx >= (int)fb->width) mx = fb->width - 1;
        if (my >= (int)fb->height) my = fb->height - 1;
    }
}
